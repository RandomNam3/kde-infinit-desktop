#
# Every version gets its tag (vX.Y.Z) and its GitHub release, which the update
# check of the settings app reads.
#
# - Push to main: if the project version in CMakeLists.txt has no tag yet, the
#   tag is created on that commit and the release is published.
# - Manual run with a commit: releases the version of that commit (for a
#   version that was merged without its release). GitHub only lets this
#   workflow's token create a tag on a commit whose workflow files match the
#   ones on main; for an older commit, create the tag by hand (a release on
#   github.com) and run this with the tag to add the notes.
# - Pushing a tag vX.Y.Z by hand still works; it has to match the version.
#
# The release notes are docs/releases/X.Y.Z.md (Markdown, without a title line;
# taken from main, so they can be added after the fact); without that file, the
# body of an annotated tag. GitHub adds the source archive the packages build
# from (archive/refs/tags/vX.Y.Z.tar.gz).
# Prebuilt packages per KWin version come from packages.yml ("kwin-builds").

name: Release

on:
  push:
    branches: [main]
    paths: ['CMakeLists.txt', 'docs/releases/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Commit (or branch) whose version is released
        default: main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Version, tag and notes
        id: version
        run: |
          ver=$(sed -n 's/^project(kde-infinite-desktop VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          [ -n "$ver" ] || { echo "::error::no project version in CMakeLists.txt"; exit 1; }
          tag="v$ver"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the project version $ver"
            exit 1
          fi
          echo "version $ver, tag $tag, commit $(git rev-parse --short HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # the checkout may not carry the annotated tag object, fetch it explicitly
          git fetch --force --no-tags origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          git fetch --no-tags origin main
          if git show "origin/main:docs/releases/$ver.md" > notes.md 2>/dev/null && [ -s notes.md ]; then
            echo "notes: docs/releases/$ver.md"
          elif [ -s "docs/releases/$ver.md" ]; then
            cp "docs/releases/$ver.md" notes.md
            echo "notes: docs/releases/$ver.md of this commit"
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git for-each-ref "refs/tags/$tag" --format='%(contents:body)' > notes.md
            echo "notes: body of the tag"
          fi
          if [ ! -s notes.md ]; then
            echo "::warning::no release notes in docs/releases/$ver.md"
            echo "KDE Infinite Desktop $ver" > notes.md
          fi

      - name: Create the tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG exists ($(git rev-parse --short "$TAG^{commit}"))"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          { echo "KDE Infinite Desktop ${TAG#v}"; echo; cat notes.md; } > tag-message.md
          git tag -a --cleanup=verbatim -F tag-message.md "$TAG" HEAD
          git push origin "refs/tags/$TAG"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "KDE Infinite Desktop ${TAG#v}" --notes-file notes.md
          fi
