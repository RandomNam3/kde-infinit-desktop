//
// Rebuild KDE Infinit Desktop after KWin updates (KWin only loads plugins
// built for its exact version). Installed by scripts/install.sh as
// /etc/apt/apt.conf.d/99kde-infinit-desktop. The hook script only compares
// two version strings unless KWin really changed, and it never fails.
// Log: /var/log/kde-infinit-desktop-rebuild.log
DPkg::Post-Invoke { "if [ -x /usr/lib/kde-infinit-desktop/kwin-update-hook.sh ]; then /usr/lib/kde-infinit-desktop/kwin-update-hook.sh apt || true; fi"; };
